---
- name: Require the qualified Debian 13 host baseline
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution == "Debian"
      - ansible_distribution_major_version == "13"
    fail_msg: "M1 host provisioning is qualified only for Debian 13 (Trixie); qualify another release before broadening this assertion."

- name: Install M1 runtime and explicit SIMH build dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gcc
      - gzip
      - libc6-dev
      - make
      - python3
      - python3-yaml
      - tar
    state: present
    update_cache: true

- name: Create controlled SIMH source cache
  ansible.builtin.file:
    path: /var/cache/unix-time-machine
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch the pinned Open SIMH source archive
  ansible.builtin.get_url:
    url: "{{ utm_simh_archive_url }}"
    dest: "{{ utm_simh_archive }}"
    checksum: "sha256:{{ utm_simh_archive_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Inspect installed SIMH provenance
  ansible.builtin.stat:
    path: "{{ utm_simh_provenance }}"
  register: utm_simh_provenance_stat

- name: Inspect installed SIMH executable
  ansible.builtin.stat:
    path: "{{ utm_simh_executable }}"
  register: utm_simh_executable_stat

- name: Read installed SIMH provenance
  ansible.builtin.slurp:
    path: "{{ utm_simh_provenance }}"
  register: utm_simh_installed_provenance
  when: utm_simh_provenance_stat.stat.exists

- name: Decide whether the pinned SIMH build is installed
  ansible.builtin.set_fact:
    utm_simh_expected_provenance: "{{ lookup('ansible.builtin.template', 'PROVENANCE.j2') }}"
    utm_simh_install_current: >-
      {{ utm_simh_provenance_stat.stat.exists and
         utm_simh_executable_stat.stat.exists and utm_simh_executable_stat.stat.executable and
         (utm_simh_installed_provenance.content | b64decode) == lookup('ansible.builtin.template', 'PROVENANCE.j2') }}
  changed_when: false

- name: Build and install the pinned PDP-11 simulator
  when: not utm_simh_install_current
  block:
    - name: Create isolated SIMH build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: utm-simh-build-
      register: utm_simh_build

    - name: Extract verified SIMH source
      ansible.builtin.unarchive:
        src: "{{ utm_simh_archive }}"
        dest: "{{ utm_simh_build.path }}"
        remote_src: true

    - name: Build only the PDP-11 simulator without host networking support
      ansible.builtin.command:
        argv:
          - make
          - pdp11
          - NONETWORK=1
        chdir: "{{ utm_simh_build.path }}/simh-{{ utm_simh_commit }}"

    - name: Create versioned SIMH installation directory
      ansible.builtin.file:
        path: "{{ utm_simh_prefix }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the canonical PDP-11 executable
      ansible.builtin.copy:
        src: "{{ utm_simh_build.path }}/simh-{{ utm_simh_commit }}/BIN/pdp11"
        dest: "{{ utm_simh_executable }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Record exact SIMH build provenance
      ansible.builtin.copy:
        content: "{{ utm_simh_expected_provenance }}"
        dest: "{{ utm_simh_provenance }}"
        owner: root
        group: root
        mode: "0644"
  always:
    - name: Remove isolated SIMH source and build tree
      ansible.builtin.file:
        path: "{{ utm_simh_build.path }}"
        state: absent
      when: utm_simh_build.path is defined

- name: Create UNIX Time Machine service group
  ansible.builtin.group:
    name: unix-time-machine
    system: true

- name: Create UNIX Time Machine service account
  ansible.builtin.user:
    name: unix-time-machine
    group: unix-time-machine
    home: /srv/unix-time-machine
    create_home: false
    shell: /usr/sbin/nologin
    system: true

- name: Create canonical directories
  ansible.builtin.file:
    path: "/srv/unix-time-machine/{{ item }}"
    state: directory
    owner: root
    group: unix-time-machine
    mode: "0750"
  loop:
    - media
    - golden

- name: Create per-system M1 directories
  ansible.builtin.file:
    path: "/srv/unix-time-machine/{{ item }}"
    state: directory
    owner: root
    group: unix-time-machine
    mode: "2750"
  loop:
    - media/unix-v7-pdp11

- name: Create immutable golden publication target
  ansible.builtin.file:
    path: /srv/unix-time-machine/golden/unix-v7-pdp11
    state: directory
    owner: root
    group: unix-time-machine
    mode: "0750"

- name: Allow the service account to create runtime state
  ansible.builtin.file:
    path: "/srv/unix-time-machine/{{ item }}"
    state: directory
    owner: unix-time-machine
    group: unix-time-machine
    mode: "2770"
  loop:
    - state
    - sessions
    - sessions/unix-v7-pdp11
    - snapshots
    - logs
    - reports

- name: Verify the canonical PDP-11 emulator is runnable

  ansible.builtin.shell: |

    set -o pipefail

    printf 'show version\nquit\n' | timeout 5s /opt/unix-time-machine/simh/v3.12-3/pdp11

  args:

    executable: /bin/bash

  register: simh_runtime_check

  changed_when: false

  failed_when: simh_runtime_check.rc != 0
