id: unix-v7-pdp11
name: UNIX Seventh Edition
short_name: UNIX V7
track: unix
year: 1979
vendor: Bell Laboratories
family: Research UNIX
machine:
  vendor: Digital Equipment Corporation
  model: PDP-11/70
  cpu: PDP-11
  memory: 2M
emulator:
  family: simh
  profile: pdp11
  executable: /opt/unix-time-machine/simh/v3.12-3/pdp11
  configuration: simh.ini.in
  installation_bootstrap_configuration: install-bootstrap.ini.in
  installation_runtime_configuration: install-runtime.ini.in
  boot_device: RP0
  storage:
    controller: RH70
    device: RP06
terminal:
  preferred: vt100
  fallback: ansi
media:
  policy: external
  directory: unix-v7-pdp11
  items:
    - logical_name: installation-tape
      filenames:
        - v7.tap
        - unix-v7.tap
      size: 11711508
      sha256: e2a6c5d420e2db62e992a95fce420bf311c3afa89b38381b8d212c92eef5a6cf
      sha1: 8056d35a2cb6529330f26db5754e858c9eab0462
      required: true
      purpose: Operator-supplied UNIX Seventh Edition installation tape image
prepared:
  disks:
    - id: root
      unit: RP0
      device: RP06
      golden_filename: rp0.dsk
      session_filename: rp0.dsk
      runtime_token: "@SESSION_RP0@"
    - id: usr
      unit: RP1
      device: RP06
      golden_filename: rp1.dsk
      session_filename: rp1.dsk
      runtime_token: "@SESSION_RP1@"
readiness:
  patterns:
    - "login:"
  timeout_seconds: 120
session:
  public_eligible: false
  reset_strategy: copy-on-session
  network: terminal-only
status: complete
